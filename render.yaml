# ==============================================================================
# AIRWISE AI — Render Infrastructure-as-Code Blueprint (render.yaml)
# Containerized FastAPI backend service with MongoDB Atlas connectivity
# ==============================================================================
version: "1"

services:
  # ----------------------------------------------------------------------------
  # AIRWISE AI — Backend REST API Web Service
  # ----------------------------------------------------------------------------
  - type: web
    name: airwise-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    region: frankfurt
    plan: starter # 0.5 CPU, 512MB RAM minimum recommended for ML/API async load
    healthCheckPath: /api/v1/health/live
    autoDeploy: false
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: ENABLE_DOCS
        value: "false" # Disabled by default in production; toggle to "true" if public API exploration is desired
      - key: MONGODB_URI
        sync: false # Set securely in Render dashboard (e.g. mongodb+srv://<user>:<pwd>@cluster0.mongodb.net/?retryWrites=true&w=majority)
      - key: DB_NAME
        value: airwise_db
      - key: MONGODB_MAX_POOL_SIZE
        value: "50"
      - key: SECRET_KEY
        generateValue: true # Secure random cryptographic string generated by Render
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: "none" # Set to 'lax' if using shared apex domain (e.g. *.airwise.ai); 'none' for cross-domain
      - key: COOKIE_DOMAIN
        value: "" # Set to '.airwise.ai' when custom domain is mapped
      - key: FRONTEND_URL
        value: https://airwise.ai
      - key: BACKEND_URL
        value: https://airwise-backend.onrender.com
      - key: ALLOWED_ORIGINS
        value: '["https://airwise.ai","https://www.airwise.ai","https://airwise.vercel.app"]'
      - key: GEMINI_API_KEY
        sync: false # Set manually in Render dashboard
      - key: GEMINI_MODEL
        value: gemini-1.5-pro
      - key: WAQI_API_TOKEN
        sync: false # Set manually in Render dashboard
      - key: AIR_QUALITY_CACHE_TTL_SECONDS
        value: "900"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: RATE_LIMIT_REQUESTS_PER_MINUTE
        value: "60"
      - key: AUTH_RATE_LIMIT_REQUESTS_PER_MINUTE
        value: "15"
