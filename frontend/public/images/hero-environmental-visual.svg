<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 720" fill="none" preserveAspectRatio="xMidYMid slice" className="w-full h-full">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="airGlow" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.18" />
      <stop offset="40%" stop-color="#0284C7" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="tealAura" cx="20%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#0D9488" stop-opacity="0.14" />
      <stop offset="60%" stop-color="#0284C7" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0" />
    </radialGradient>

    <!-- Air Stream Linear Gradients -->
    <linearGradient id="streamGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="streamGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#10B981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0D9488" stop-opacity="0.05" />
    </linearGradient>

    <!-- Mesh Filter -->
    <filter id="atmosphericBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>
  </defs>

  <!-- Ambient Light Fields -->
  <rect width="1440" height="720" fill="url(#airGlow)" />
  <rect width="1440" height="720" fill="url(#tealAura)" />

  <!-- Topographic Atmospheric Isobar Contours -->
  <g stroke="currentColor" stroke-opacity="0.08" stroke-width="1.2" fill="none">
    <path d="M-100,180 C240,120 480,260 760,190 C1040,120 1280,230 1540,160" />
    <path d="M-100,240 C220,180 520,310 800,240 C1080,170 1300,290 1540,220" />
    <path d="M-100,300 C200,240 560,370 840,290 C1120,210 1320,350 1540,280" />
    <path d="M-100,380 C180,320 590,440 880,360 C1160,280 1340,410 1540,350" />
    <path d="M-100,460 C260,390 630,510 920,430 C1200,350 1360,470 1540,420" />
    <path d="M-100,540 C300,470 680,580 970,510 C1240,430 1390,540 1540,490" />
  </g>

  <!-- Flowing Dynamic Air Stream Vectors -->
  <g fill="none" stroke-linecap="round">
    <path d="M-60,140 Q320,260 680,130 T1500,180" stroke="url(#streamGrad1)" stroke-width="2.5" stroke-dasharray="8 12" opacity="0.65" />
    <path d="M-80,220 Q260,380 720,210 T1520,290" stroke="url(#streamGrad2)" stroke-width="2" stroke-dasharray="12 16" opacity="0.55" />
    <path d="M-40,360 Q380,480 840,320 T1540,390" stroke="url(#streamGrad1)" stroke-width="1.8" stroke-dasharray="6 14" opacity="0.45" />
    <path d="M120,40 Q460,180 920,80 T1540,120" stroke="url(#streamGrad2)" stroke-width="2.2" opacity="0.4" />
    <path d="M-100,500 Q400,620 980,440 T1560,520" stroke="url(#streamGrad1)" stroke-width="2" stroke-dasharray="10 14" opacity="0.5" />
  </g>

  <!-- Environmental Telemetry Sensor Node Grid -->
  <g fill="#10B981">
    <circle cx="340" cy="190" r="3" opacity="0.5" />
    <circle cx="340" cy="190" r="10" stroke="#10B981" stroke-width="1" stroke-opacity="0.2" fill="none" />
    <circle cx="680" cy="130" r="4" opacity="0.7" />
    <circle cx="680" cy="130" r="14" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.3" fill="none" />
    <circle cx="840" cy="320" r="3.5" opacity="0.6" fill="#38BDF8" />
    <circle cx="1120" cy="220" r="3" opacity="0.4" />
    <circle cx="1260" cy="380" r="4" opacity="0.65" />
    <circle cx="1260" cy="380" r="16" stroke="#10B981" stroke-width="1" stroke-opacity="0.25" fill="none" />
    <circle cx="980" cy="440" r="3" opacity="0.5" />
    <circle cx="520" cy="410" r="2.5" opacity="0.4" />
    <circle cx="210" cy="330" r="3" opacity="0.5" />
  </g>

  <!-- Connection Rays between Sensor Nodes -->
  <g stroke="currentColor" stroke-opacity="0.06" stroke-width="1" stroke-dasharray="3 6">
    <line x1="340" y1="190" x2="680" y2="130" />
    <line x1="680" y1="130" x2="840" y2="320" />
    <line x1="840" y1="320" x2="1120" y2="220" />
    <line x1="1120" y1="220" x2="1260" y2="380" />
    <line x1="840" y1="320" x2="980" y2="440" />
  </g>
</svg>
