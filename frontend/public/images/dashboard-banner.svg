<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" fill="none" preserveAspectRatio="xMidYMid slice" className="w-full h-full">
  <defs>
    <linearGradient id="dashGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0D9488" stop-opacity="0.08" />
    </linearGradient>
    <radialGradient id="dashAura" cx="85%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="240" fill="url(#dashGrad)" />
  <rect width="1200" height="240" fill="url(#dashAura)" />

  <!-- Technical Atmospheric Grid Lines -->
  <g stroke="currentColor" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="40" x2="1200" y2="40" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="220" x2="1200" y2="220" />
    <line x1="200" y1="0" x2="200" y2="240" />
    <line x1="450" y1="0" x2="450" y2="240" />
    <line x1="700" y1="0" x2="700" y2="240" />
    <line x1="950" y1="0" x2="950" y2="240" />
  </g>

  <!-- Flow Wave Lines -->
  <path d="M0,80 C300,160 600,40 900,120 C1050,160 1150,100 1200,90" fill="none" stroke="#10B981" stroke-width="1.8" stroke-dasharray="6 8" opacity="0.4" />
  <path d="M0,140 C280,60 580,180 880,100 C1040,60 1140,140 1200,130" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="10 12" opacity="0.35" />

  <!-- Coordinates & Satellite Beacon Rings -->
  <g fill="#10B981">
    <circle cx="1020" cy="70" r="4" opacity="0.8" />
    <circle cx="1020" cy="70" r="18" stroke="#10B981" stroke-width="1" stroke-opacity="0.3" fill="none" />
    <circle cx="1020" cy="70" r="32" stroke="#10B981" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="4 6" fill="none" />
    
    <circle cx="750" cy="140" r="3" opacity="0.6" fill="#38BDF8" />
    <circle cx="750" cy="140" r="14" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.25" fill="none" />
  </g>
</svg>
