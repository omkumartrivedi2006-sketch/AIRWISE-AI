services:
  # 1. MongoDB Database Service
  mongodb:
    image: mongo:7.0-jammy
    container_name: airwise_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - airwise_network

  # 2. FastAPI Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: airwise_backend
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      BACKEND_HOST: "0.0.0.0"
      BACKEND_PORT: 8000
      MONGODB_URI: mongodb://mongodb:27017
      DB_NAME: ${DB_NAME:-airwise_db}
      SECRET_KEY: ${SECRET_KEY:-airwise-production-secret-replace-with-openssl-rand-hex-32}
      ALLOWED_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000"]'
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      WAQI_API_TOKEN: ${WAQI_API_TOKEN:-}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - airwise_network

  # 3. Next.js Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: airwise_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    networks:
      - airwise_network

volumes:
  mongo_data:
    driver: local

networks:
  airwise_network:
    driver: bridge
