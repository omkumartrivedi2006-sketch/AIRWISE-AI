name: AIRWISE AI — Quality & CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # --------------------------------------------------------------------------
  # Backend Continuous Integration
  # --------------------------------------------------------------------------
  backend-ci:
    name: Backend Lint & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Pytest Suite
        env:
          MONGODB_URI: mongodb://localhost:27017
          DB_NAME: airwise_test_db
          SECRET_KEY: test-secret-key-32chars-for-github-actions-ci
          ENVIRONMENT: test
          DEBUG: "False"
          RATE_LIMIT_ENABLED: "False"
        run: |
          cd backend
          pytest tests -v

  # --------------------------------------------------------------------------
  # Frontend Continuous Integration
  # --------------------------------------------------------------------------
  frontend-ci:
    name: Frontend Typecheck & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Dependencies
        run: |
          cd frontend
          npm install --prefer-offline --no-audit

      - name: Validate TypeScript Compilation
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Execute Production Build
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          cd frontend
          npm run build
