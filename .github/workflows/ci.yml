name: AIRWISE AI — Quality & CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # --------------------------------------------------------------------------
  # Backend Continuous Integration
  # --------------------------------------------------------------------------
  backend-ci:
    name: Backend Lint & Automated Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: airwise_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Pytest Suite
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/airwise_test_db
          SECRET_KEY: test-secret-key-32chars-for-github-actions-ci
          ENVIRONMENT: test
          DEBUG: "False"
          RATE_LIMIT_ENABLED: "False"
        run: |
          cd backend
          pytest tests -v

  # --------------------------------------------------------------------------
  # Frontend Continuous Integration
  # --------------------------------------------------------------------------
  frontend-ci:
    name: Frontend Typecheck & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Validate TypeScript Compilation
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Execute Production Build
        run: |
          cd frontend
          npm run build
